syntax = "proto3";

package product.v1;

option go_package = "github.com/ogrock3t/go-marketplace-microservices/proto/product/v1;productv1";

service InventoryService {
  rpc ReserveProduct(ReserveProductRequest) returns (ProductResponse);
  rpc ReleaseProduct(ReleaseProductRequest) returns (ProductResponse);
}

message ReserveProductRequest {
  int64 product_id = 1;
  int64 quantity = 2;
}

message ReleaseProductRequest {
  int64 product_id = 1;
  int64 quantity = 2;
}

message ProductResponse {
  int64 id = 1;
  int64 seller_id = 2;
  int64 category_id = 3;
  string name = 4;
  string description = 5;
  int64 price = 6;
  int64 available_quantity = 7;
  string status = 8;
}
