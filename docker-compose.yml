services:
  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_DSN: ${AUTH_DATABASE_DSN}
      RSA_PRIVATE_KEY_PATH: ${AUTH_RSA_PRIVATE_KEY_PATH}
    volumes:
      - ./auth-service/keys:/app/keys:ro
    depends_on:
      auth-postgres:
        condition: service_healthy

  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_DSN: ${PRODUCT_DATABASE_DSN}
      HTTP_ADDR: ":8081"
    depends_on:
      product-postgres:
        condition: service_healthy

  product-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PRODUCT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PRODUCT_POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_POSTGRES_USER} -d ${PRODUCT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
