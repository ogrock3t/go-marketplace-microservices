services:
  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_DSN: ${AUTH_DATABASE_DSN}
      RSA_PRIVATE_KEY_PATH: ${AUTH_RSA_PRIVATE_KEY_PATH}
    volumes:
      - ./auth-service/keys:/app/keys:ro
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      DATABASE_DSN: ${PRODUCT_DATABASE_DSN:-postgres://user:pass@product-postgres:5432/productdb?sslmode=disable}
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9091"
    depends_on:
      product-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PRODUCT_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${PRODUCT_POSTGRES_DB:-productdb}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_DSN: ${ORDER_DATABASE_DSN:-postgres://user:pass@order-postgres:5432/orderdb?sslmode=disable}
      HTTP_ADDR: ":8082"
      PRODUCT_GRPC_ADDR: product-service:9091
      KAFKA_BROKERS: kafka:9092
      ORDER_EVENTS_TOPIC: orders
      PAYMENT_EVENTS_TOPIC: payments
    depends_on:
      order-postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${ORDER_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${ORDER_POSTGRES_DB:-orderdb}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build: ./payment-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_DSN: ${PAYMENT_DATABASE_DSN:-postgres://user:pass@payment-postgres:5432/paymentdb?sslmode=disable}
      HTTP_ADDR: ":8083"
      KAFKA_BROKERS: kafka:9092
      ORDER_EVENTS_TOPIC: orders
      PAYMENT_EVENTS_TOPIC: payments
      PAYMENT_CONSUMER_GROUP: payment-service
    depends_on:
      payment-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PAYMENT_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${PAYMENT_POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB:-paymentdb}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-service:
    build: ./notification-service
    environment:
      KAFKA_BROKERS: kafka:9092
      ORDER_EVENTS_TOPIC: orders
      PAYMENT_EVENTS_TOPIC: payments
      NOTIFICATION_CONSUMER_GROUP: notification-service
    depends_on:
      kafka:
        condition: service_started

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
